[project]
name = "lightning-python-tools"
version = "1.0.0"
description = "Collection of Python utilities for Bitcoin Lightning nodes (LND, LNDg, Amboss Magma, PeerSwap, LNbits)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi>=2026.11.20",
    "prettytable",
    "pyTelegramBotAPI>=4.37.1",
    "requests>=2.34.2",
    "schedule>=1.2.2",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
db = [
    "psycopg2-binary",
    "pandas",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "requests-mock>=1.12",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "Other",
    "Magma",
    "LNDg",
    "Peerswap",
    "LNBits"
]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["LNDg", "Magma", "Other", "Peerswap", "LNBits", "lpt_installer"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
